'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# Source patterns: all of crypto/, plus the public headers.
#
# This deliberately covers more than the FIPS-approved-algorithm surface.
# Normative RFC requirements are implemented throughout crypto/, not only in
# crypto/fipsmodule/ — RFC 9180 (HPKE) in crypto/hpke/ and RFC 8439
# (ChaCha20-Poly1305) in crypto/cipher_extra/ are the largest instances.
# Scoping sources to the FIPS module made those requirements uncitable.
#
# Widening these patterns does not change the requirement denominator — the
# report's requirement set comes only from the [[requirement]] blocks below.
# Source patterns control where duvet looks for citations, nothing more.

[[source]]
pattern = "crypto/**/*.c"

[[source]]
pattern = "crypto/**/*.h"

[[source]]
pattern = "crypto/**/*_test.cc"
type = "test"

[[source]]
pattern = "include/openssl/*.h"

# SP 800-140C is an approvals index, not a normative prose spec.
# We hand-author requirements in `.duvet/custom-requirements/` rather than
# extracting. The specification block is included so the HTML report has a
# canonical section to hang requirements under; `format = "markdown"` is a
# valid Duvet config value (Duvet only accepts IETF or markdown here) and
# is harmless because we never invoke `duvet extract` against this target.
[[specification]]
source = "https://csrc.nist.gov/projects/cryptographic-module-validation-program/sp-800-140-series-supplemental-information/sp800-140c"
format = "markdown"

[[requirement]]
pattern = ".duvet/custom-requirements/**/*.toml"

# RFC 8032 (EdDSA) — a normative IETF spec, so requirements are extracted
# from the RFC prose (`duvet extract`) rather than hand-authored. Covers the
# Ed25519 / Ed25519ph surface in crypto/fipsmodule/curve25519/.
[[specification]]
source = "https://www.rfc-editor.org/rfc/rfc8032"
format = "ietf"

[[requirement]]
pattern = ".duvet/rfc8032-requirements/**/*.toml"

# RFC 7748 (X25519 / X448) — normative IETF spec; requirements extracted via
# `duvet extract`. Covers the X25519 / X448 surface in crypto/fipsmodule/curve25519/.
[[specification]]
source = "https://www.rfc-editor.org/rfc/rfc7748"
format = "ietf"

[[requirement]]
pattern = ".duvet/requirements/www.rfc-editor.org/rfc/rfc7748/**/*.toml"

# RFC 8032 requirements extracted from the RFC prose. This is separate from the
# hand-authored `.duvet/rfc8032-requirements/` block above, which covers the
# Ed25519ph prehash surface that the RFC text does not state normatively.
[[requirement]]
pattern = ".duvet/requirements/www.rfc-editor.org/rfc/rfc8032/**/*.toml"

# RFC 3610 (CCM mode) — normative IETF spec; requirements extracted via
# `duvet extract`. Covers crypto/fipsmodule/cipher/e_aesccm.c.
[[specification]]
source = "https://www.rfc-editor.org/rfc/rfc3610"
format = "ietf"

[[requirement]]
pattern = ".duvet/requirements/www.rfc-editor.org/rfc/rfc3610/**/*.toml"

# RFC 3394 (AES Key Wrap) — covers crypto/fipsmodule/aes/key_wrap.c.
[[specification]]
source = "https://www.rfc-editor.org/rfc/rfc3394"
format = "ietf"

[[requirement]]
pattern = ".duvet/requirements/www.rfc-editor.org/rfc/rfc3394/**/*.toml"

# RFC 5649 (AES Key Wrap with Padding) — covers crypto/fipsmodule/aes/key_wrap.c.
[[specification]]
source = "https://www.rfc-editor.org/rfc/rfc5649"
format = "ietf"

[[requirement]]
pattern = ".duvet/requirements/www.rfc-editor.org/rfc/rfc5649/**/*.toml"

# RFC 3874 (SHA-224) — covers crypto/fipsmodule/sha/.
[[specification]]
source = "https://www.rfc-editor.org/rfc/rfc3874"
format = "ietf"

[[requirement]]
pattern = ".duvet/requirements/www.rfc-editor.org/rfc/rfc3874/**/*.toml"

# RFC 9180 (HPKE) — normative IETF spec, 37 body MUSTs at 0% appendix ratio.
# Covers crypto/hpke/hpke.c. Not a FIPS-approved algorithm; included because
# the requirements are normative and the implementation is here.
[[specification]]
source = "https://www.rfc-editor.org/rfc/rfc9180"
format = "ietf"

[[requirement]]
pattern = ".duvet/requirements/www.rfc-editor.org/rfc/rfc9180/**/*.toml"

[report.html]
enabled = true
blob-link = "https://github.com/aws/aws-lc/blob/main"

[report.json]
enabled = true
