target = "https://www.rfc-editor.org/rfc/rfc5280#section-4.1.2.1"

# Version
#
#    This field describes the version of the encoded certificate.  When
#    extensions are used, as expected in this profile, version MUST be 3
#    (value is 2).  If no extensions are present, but a UniqueIdentifier
#    is present, the version SHOULD be 2 (value is 1); however, the
#    version MAY be 3.  If only basic fields are present, the version
#    SHOULD be 1 (the value is omitted from the certificate as the default
#    value); however, the version MAY be 2 or 3.
# 
#    Implementations SHOULD be prepared to accept any version certificate.
#    At a minimum, conforming implementations MUST recognize version 3
#    certificates.
# 
#    Generation of version 2 certificates is not expected by
#    implementations based on this profile.

[[spec]]
level = "MUST"
quote = '''
When
extensions are used, as expected in this profile, version MUST be 3
(value is 2).
'''

[[spec]]
level = "SHOULD"
quote = '''
If no extensions are present, but a UniqueIdentifier
is present, the version SHOULD be 2 (value is 1); however, the
version MAY be 3.
'''

[[spec]]
level = "SHOULD"
quote = '''
If only basic fields are present, the version
SHOULD be 1 (the value is omitted from the certificate as the default
value); however, the version MAY be 2 or 3.
'''

[[spec]]
level = "SHOULD"
quote = '''
Implementations SHOULD be prepared to accept any version certificate.
'''

[[spec]]
level = "MUST"
quote = '''
At a minimum, conforming implementations MUST recognize version 3
certificates.
'''

