'''

[[spec]]
level = "SHOULD"
quote = '''
When present,
DistributionPointName SHOULD include at least one LDAP or HTTP URI.
'''

[[spec]]
level = "SHOULD"
quote = '''
Conforming CAs SHOULD NOT use
nameRelativeToCRLIssuer to specify distribution point names.
'''

[[spec]]
level = "MUST"
quote = '''
The
DistributionPointName MUST NOT use the nameRelativeToCRLIssuer
